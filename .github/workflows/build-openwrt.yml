name: build-openwrt-xdg205

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'overlay/**'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Checkout overlay repo
        uses: actions/checkout@v4

      - name: Checkout OpenWrt
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: main
          path: openwrt

      - name: Cache downloads and toolchain
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/staging_dir/toolchain-*
            openwrt/staging_dir/host
            openwrt/.ccache
          key: openwrt-microchipsw-v1
          restore-keys: openwrt-microchipsw-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev \
            python3-dev python3-setuptools swig bc rsync unzip \
            zlib1g-dev file wget ccache

      - name: Apply overlay
        run: |
          cp -rv overlay/. openwrt/
          cd openwrt
          grep -n "SUBTARGETS" target/linux/microchipsw/Makefile

      - name: Configure
        run: |
          cd openwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_microchipsw=y
          CONFIG_TARGET_microchipsw_sparx5=y
          CONFIG_TARGET_microchipsw_sparx5_DEVICE_cti_xdg205=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_DEVEL=y
          CONFIG_BUILD_LOG=y
          CONFIG_CCACHE=y
          EOF
          make defconfig

      - name: Build
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          find openwrt/bin/targets -type f \
            \( -name '*.bin' -o -name '*.itb' -o -name '*.tar' -o -name 'sha256sums' \
               -o -name '*.buildinfo' -o -name 'config' \) \
            -exec cp {} artifacts/ \; || true
          if [ -d openwrt/logs ]; then
            tar czf artifacts/build-logs.tar.gz openwrt/logs || true
          fi
          ls -la artifacts/

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-microchipsw-sparx5-xdg205
          path: artifacts/
